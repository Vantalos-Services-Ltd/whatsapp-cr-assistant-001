version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: vantalos-recruiter-postgres-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vantalos_recruiter
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vantalos-network-dev

  redis:
    image: redis:7-alpine
    container_name: vantalos-recruiter-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vantalos-network-dev

volumes:
  postgres_data_dev:
  redis_data_dev:

networks:
  vantalos-network-dev:
    driver: bridge

